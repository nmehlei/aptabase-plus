name: Aptabase CI
on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aptabase
          POSTGRES_PASSWORD: aptabase_pw
        ports:
          - 5432:5432
      clickhouse:
        image: clickhouse/clickhouse-server:23.3.8.21
        env:
          CLICKHOUSE_USER: aptabase
          CLICKHOUSE_PASSWORD: aptabase_pw
        ports:
          - 8123:8123
      mailcatcher:
        image: dockage/mailcatcher:0.8.2
        ports:
          - 1025:1025
          - 1080:1080
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup .NET Core SDK 10.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Run Webapp Tests
        run: npm ci && npm test
        working-directory: src

      - name: Run Unit Tests
        run: dotnet test
        working-directory: tests/UnitTests

      - name: Run Integration Tests
        run: dotnet test
        working-directory: tests/IntegrationTests

  # Runs on every push, no containers: detects whether etc/tinybird changed and checks ClickHouse
  # parity. Exposes `changed`, used to skip tinybird-build and the Tinybird deploy jobs (and their
  # approvals) when the push did not touch etc/tinybird.
  tinybird-check:
    name: Tinybird Check
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.tinybird }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes in etc/tinybird
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base commit (new branch or force push); assuming etc/tinybird changed."
            echo "tinybird=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation inside etc/tinybird does not need a deployment.
          PATHS=(etc/tinybird ':!etc/tinybird/*.md')
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "${PATHS[@]}"; then
            echo "No changes in etc/tinybird between $BEFORE and $GITHUB_SHA."
            echo "tinybird=false" >> "$GITHUB_OUTPUT"
          else
            echo "etc/tinybird changed between $BEFORE and $GITHUB_SHA:"
            git diff --name-only "$BEFORE" "$GITHUB_SHA" -- "${PATHS[@]}"
            echo "tinybird=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check every Tinybird endpoint has a ClickHouse twin
        run: |
          missing=0
          for pipe in etc/tinybird/endpoints/*.pipe; do
            name=$(basename "$pipe" .pipe)
            if [ ! -f "etc/clickhouse/queries/$name.liquid" ]; then
              echo "::error file=$pipe::Missing ClickHouse twin etc/clickhouse/queries/$name.liquid"
              missing=1
            fi
          done
          exit $missing

  # Only when etc/tinybird changed: a token-free `tb --local build` against a Tinybird Local
  # container, plus a deploy check against the dev workspace (skipped when TINYBIRD_DEV_TOKEN is
  # not available, e.g. forks). Split from tinybird-check so the container is not pulled otherwise.
  tinybird-build:
    if: ${{ needs.tinybird-check.outputs.changed == 'true' }}
    name: Tinybird Build
    runs-on: ubuntu-latest
    needs: [tinybird-check]
    services:
      tinybird:
        image: tinybirdco/tinybird-local:latest
        ports:
          - 7181:7181
    env:
      TB_HOST: https://api.tinybird.co
      TB_TOKEN: ${{ secrets.TINYBIRD_DEV_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Tinybird CLI
        uses: ./.github/actions/setup-tinybird

      - name: Tinybird local build
        run: tb --local build
        working-directory: etc/tinybird

      - name: Tinybird deploy check (dev)
        if: env.TB_TOKEN != ''
        run: tb --cloud --host "$TB_HOST" --token "$TB_TOKEN" deploy --check
        working-directory: etc/tinybird

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          tags: aptabase:${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/aptabase-${{ matrix.platform }}.tar

      - name: Upload Image
        uses: actions/upload-artifact@v7
        with:
          name: aptabase-${{ matrix.platform }}
          path: /tmp/aptabase-${{ matrix.platform }}.tar

  # NOTE (aptabase-plus fork): upstream's `publish`, `deploy-us` and `deploy-eu`
  # jobs were removed here. They pushed to `ghcr.io/aptabase/aptabase` and assumed
  # Aptabase's AWS OIDC roles, so on this fork they fail forever and double the
  # Docker build cost. Image publishing for this fork lives in `release.yml`
  # (GHCR under `ghcr.io/nmehlei/aptabase-plus`, gated on a version tag).
